<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me | My Personal Profile</title>
<style>
  /* Global Page Settings */
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #f4f7f6;
    color: #333333;
    line-height: 1.6;
    margin: 0;
    padding: 0;
  }

  /* Header Section Styling */
  header {
    background-color: #1a365d;
    color: #ffffff;
    text-align: center;
    padding: 60px 20px;
  }

  header h1 {
    margin: 0;
    font-size: 2.8rem;
  }

  header p {
    font-size: 1.2rem;
    margin: 10px 0 0 0;
    color: #cbd5e0;
  }

  /* Main Container */
  .container {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
  }

  /* Content Card Styling */
  .card {
    background: #ffffff;
    border-radius: 8px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  }

  .card h2 {
    color: #2b6cb0;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 8px;
    margin-top: 0;
  }

  /* List Layout styling for Skills */
  .skills-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    list-style: none;
    padding: 0;
  }

  .skills-list li {
    background-color: #e2ece9;
    color: #2cc197;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.95rem;
  }

  /* Footer Section Styling */
  footer {
    text-align: center;
    padding: 30px;
    background-color: #1a365d;
    color: #ffffff;
    margin-top: 60px;
    font-size: 0.9rem;
